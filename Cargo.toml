[package]
name = "scarlet"
version = "0.1.0"
edition = "2021"
description = "Our own YouTube client: YouTube, Music, TV and Studio in one window, with ad skipping, SponsorBlock, a mini player and a yt-dlp downloader."
license = "MIT"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = true
strip = true
