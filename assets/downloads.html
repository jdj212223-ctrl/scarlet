<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #0f0f0f; --card: #1c1c1c; --fg: #eee; --dim: #a0a0a0; --red: #e11d2a; --ok: #3ccf6e; --warn: #f2b33d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.lead { color: var(--dim); margin: 0 0 22px; line-height: 1.5; }
  .card { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; }
  input[type=url] { flex: 1; background: #111; color: var(--fg); border: 1px solid #333; border-radius: 10px; padding: 10px 12px; font: inherit; }
  select, button { background: #2a2a2a; color: var(--fg); border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; cursor: pointer; }
  button.go { background: var(--red); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  label.rights { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; color: var(--dim); line-height: 1.45; }
  .info { margin-top: 12px; color: var(--dim); min-height: 1.4em; }
  .info.ok { color: var(--ok); } .info.warn { color: var(--warn); } .info.bad { color: #ff6b6b; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-top: 1px solid #2a2a2a; }
  li:first-child { border-top: 0; }
  .t { font-weight: 600; } .s { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .bar { height: 5px; background: #333; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s; }
  a { color: #8ab4ff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Downloads</h1>
  <p class="lead">Save videos you have the right to keep: <b>your own uploads</b> or videos under a <b>Creative Commons</b> license.
    YouTube's rules don't allow downloading other people's videos (YouTube Premium's own offline mode is the way for those).</p>

  <div class="card">
    <div class="row">
      <input id="url" type="url" placeholder="Paste a YouTube link, or press “⬇ This video” in the top bar">
      <select id="fmt">
        <option value="video">Video (MP4)</option>
        <option value="audio">Audio only (M4A)</option>
      </select>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="check">Check video</button>
      <button id="go" class="go" disabled>Download</button>
    </div>
    <div id="info" class="info"></div>
    <label class="rights"><input id="mine" type="checkbox">
      <span>This is my own video (or I have the owner's permission). Creative Commons videos don't need this: Scarlet checks the license itself.</span></label>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <b>Saved to <span id="folder">Downloads/Scarlet</span></b>
      <a onclick="send({cmd:'open_folder'})">Open folder</a>
    </div>
    <ul id="jobs" style="margin-top:10px"></ul>
  </div>
</main>
<script>
  const send = o => window.ipc.postMessage(JSON.stringify(o));
  const $ = id => document.getElementById(id);
  let checked = null; // { url, cc, title, channel }
  const canGo = () => checked && checked.url === $('url').value.trim() && (checked.cc || $('mine').checked);
  const refresh = () => { $('go').disabled = !canGo(); };
  $('url').oninput = () => { checked = null; $('info').textContent = ''; $('info').className = 'info'; refresh(); };
  $('mine').onchange = refresh;
  $('check').onclick = () => {
    const url = $('url').value.trim();
    if (!url) return;
    $('info').className = 'info'; $('info').textContent = 'Checking…';
    send({ cmd: 'check', url });
  };
  $('go').onclick = () => {
    if (!canGo()) return;
    send({ cmd: 'download', url: checked.url, format: $('fmt').value, own: $('mine').checked });
  };
  // Called from Rust.
  window.setUrl = u => { $('url').value = u; $('url').oninput(); $('check').onclick(); };
  window.setFolder = f => { $('folder').textContent = f; };
  window.onChecked = r => {
    if (r.error) { $('info').className = 'info bad'; $('info').textContent = r.error; return; }
    checked = { url: r.url, cc: r.cc, title: r.title, channel: r.channel };
    $('info').className = 'info ' + (r.cc ? 'ok' : 'warn');
    $('info').textContent = `“${r.title}” by ${r.channel} · ` +
      (r.cc ? 'Creative Commons ✓ free to download' : `License: ${r.license || 'standard YouTube license'}. Only download it if it's your own video.`);
    refresh();
  };
  const jobs = {};
  window.job = j => {
    let li = jobs[j.id];
    if (!li) {
      li = jobs[j.id] = document.createElement('li');
      li.innerHTML = '<div class="t"></div><div class="s"></div><div class="bar"><i></i></div>';
      $('jobs').prepend(li);
    }
    li.querySelector('.t').textContent = j.title;
    li.querySelector('.s').textContent = j.status;
    li.querySelector('i').style.width = (j.percent ?? 0) + '%';
  };
  send({ cmd: 'ready' });
</script>
</body>
</html>
