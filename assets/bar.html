<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #141414; --fg: #eee; --dim: #9a9a9a; --red: #e11d2a; --chip: #262626; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font: 13px -apple-system, "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; overflow: hidden; }
  body { display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .logo { font-weight: 800; color: var(--red); letter-spacing: .5px; margin-right: 8px; }
  button { background: var(--chip); color: var(--fg); border: 0; border-radius: 8px; padding: 6px 11px; font: inherit; cursor: pointer; }
  button:hover { background: #333; }
  .tab.on { background: var(--red); color: #fff; }
  .sp { flex: 1; }
  .tog { color: var(--dim); }
  .tog.on { color: #fff; box-shadow: inset 0 0 0 1px var(--red); }
  .icon { padding: 6px 9px; }
</style>
</head>
<body>
  <span class="logo">▶ Scarlet</span>
  <button class="icon" title="Back" onclick="send('back')">◀</button>
  <button class="icon" title="Reload" onclick="send('reload')">↻</button>
  <button class="tab on" data-tab="youtube">YouTube</button>
  <button class="tab" data-tab="music">Music</button>
  <button class="tab" data-tab="tv">TV</button>
  <button class="tab" data-tab="studio">Studio</button>
  <button class="tab" data-tab="downloads">Downloads</button>
  <span class="sp"></span>
  <button class="tog" id="adblock" title="Skip and hide ads">Ad skip</button>
  <button class="tog" id="sponsorblock" title="Skip sponsor segments (SponsorBlock)">SponsorBlock</button>
  <button title="Pop the video out into a mini player" onclick="send('pip')">Mini player</button>
  <button title="Send this video to the downloader" onclick="send('grab')">⬇ This video</button>
<script>
  const send = m => window.ipc.postMessage(m);
  for (const b of document.querySelectorAll('.tab')) b.onclick = () => send('tab:' + b.dataset.tab);
  for (const id of ['adblock', 'sponsorblock']) document.getElementById(id).onclick = e => send('toggle:' + id);
  // Rust calls these to keep the bar in sync.
  window.showTab = t => document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  window.showSettings = s => { for (const k in s) document.getElementById(k)?.classList.toggle('on', !!s[k]); };
</script>
</body>
</html>
